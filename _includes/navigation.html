<nav class="nav" aria-label="Main">
  {% for item in site.data.navigation %}
    {% assign active = false %}
    {% if page.url contains item.match %}{% assign active = true %}{% endif %}
    {% if item.match == '/blog' and page.layout == 'post' %}{% assign active = true %}{% endif %}
    <a href="{{ item.link }}"{% if active %} aria-current="page"{% endif %}>{{ item.name }}</a>
  {% endfor %}
</nav>
